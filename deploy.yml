---
- name: Deploy DevOps Java Application
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: Remove old Docker container
      community.docker.docker_container:
        name: devops-cicd-container
        state: absent

    - name: Run Docker container
      community.docker.docker_container:
        name: devops-cicd-container
        image: "devops-cicd-app:{{ build_number }}"
        state: started
        detach: false
